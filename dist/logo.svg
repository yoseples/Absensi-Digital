<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <path id="textArc" d="M 85 220 A 185 185 0 0 1 415 220" fill="none" />
  </defs>

  <!-- Outer Pentagon Shield -->
  <polygon points="250,15 480,180 392,465 108,465 20,180" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Inner Pentagon Gold & White Borders -->
  <polygon points="250,32 462,185 380,448 120,448 38,185" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="250,40 454,188 374,440 126,440 46,188" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" stroke-linejoin="round"/>

  <!-- Arc Text TUT WURI HANDAYANI -->
  <text font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="27" fill="#ffffff" letter-spacing="2" text-anchor="middle">
    <textPath href="#textArc" startOffset="50%">TUT WURI HANDAYANI</textPath>
  </text>

  <!-- Main Symbol Group -->
  <g transform="translate(0, 15)">
    <!-- Open Book at Base -->
    <g id="book">
      <path d="M 250,382 Q 195,365 130,378 L 135,412 Q 195,400 250,415 Q 305,400 365,412 L 370,378 Q 305,365 250,382 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 250,382 L 250,415" stroke="#0f172a" stroke-width="3"/>
      <!-- Pages lines -->
      <path d="M 150,388 Q 195,378 240,390" fill="none" stroke="#64748b" stroke-width="2"/>
      <path d="M 350,388 Q 305,378 260,390" fill="none" stroke="#64748b" stroke-width="2"/>
      <path d="M 155,398 Q 195,388 240,400" fill="none" stroke="#64748b" stroke-width="2"/>
      <path d="M 345,398 Q 305,388 260,400" fill="none" stroke="#64748b" stroke-width="2"/>
    </g>

    <!-- Garuda Wings (Sayap) -->
    <g fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round">
      <!-- Left Wing Structure -->
      <path d="M 245,365 
               C 210,350 160,325 125,260 
               C 112,235 118,205 130,185 
               C 133,180 138,190 135,205 
               C 142,185 152,165 165,145 
               C 168,140 173,150 168,170 
               C 178,150 192,132 208,118 
               C 212,114 216,124 210,142 
               C 220,132 232,122 244,115 
               C 247,113 249,122 245,138 
               L 245,365 Z" />

      <!-- Right Wing Structure -->
      <path d="M 255,365 
               C 290,350 340,325 375,260 
               C 388,235 382,205 370,185 
               C 367,180 362,190 365,205 
               C 358,185 348,165 335,145 
               C 332,140 327,150 332,170 
               C 322,150 308,132 292,118 
               C 288,114 284,124 290,142 
               C 280,132 268,122 256,115 
               C 253,113 251,122 255,138 
               L 255,365 Z" />
    </g>

    <!-- Center Torch / Flame (Belencong) -->
    <g id="torch">
      <!-- Torch Stem / Base -->
      <path d="M 242,375 L 258,375 L 254,320 L 246,320 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
      <ellipse cx="250" cy="320" rx="10" ry="4" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
      
      <!-- Outer Flame -->
      <path d="M 250,165 C 220,215 224,275 240,318 C 250,308 250,308 260,318 C 276,275 280,215 250,165 Z" fill="url(#flameGrad)" stroke="#92400e" stroke-width="2.5"/>
      
      <!-- Inner Bright Flame -->
      <path d="M 250,195 C 236,230 238,270 246,298 C 250,293 250,293 254,298 C 262,270 264,230 250,195 Z" fill="#fef08a" opacity="0.95"/>
    </g>
  </g>
</svg>
